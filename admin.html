<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastBite POS | Admin Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="admin.css">
</head>
<body class="bg-gray-100 min-h-screen font-sans">
    <div id="admin-login" class="min-h-screen flex items-center justify-center p-4">
        <form id="admin-login-form" class="w-full max-w-md bg-white rounded-3xl shadow-sm border border-gray-100 p-8 space-y-6">
            <div class="text-center">
                <div class="w-16 h-16 mx-auto mb-4 bg-orange-100 text-orange-600 rounded-2xl flex items-center justify-center"><i class="fas fa-user-shield text-2xl"></i></div>
                <h1 class="text-2xl font-bold text-gray-800">Admin Management</h1>
                <p class="text-sm text-gray-500 mt-1">Sign in with an administrator account.</p>
            </div>
            <div>
                <label for="admin-username" class="text-xs font-bold text-gray-400 uppercase tracking-wider block mb-2">Username</label>
                <input id="admin-username" type="text" autocomplete="username" required class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:border-orange-500" placeholder="Enter username">
            </div>
            <div>
                <label for="admin-password" class="text-xs font-bold text-gray-400 uppercase tracking-wider block mb-2">Password</label>
                <input id="admin-password" type="password" autocomplete="current-password" required class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:border-orange-500" placeholder="Enter password">
            </div>
            <p id="admin-login-error" class="hidden text-sm text-red-500 text-center"></p>
            <button class="w-full py-3.5 bg-orange-600 hover:bg-orange-700 text-white rounded-2xl font-bold transition-colors" type="submit">Enter Admin System</button>
            <a href="/" class="block text-center text-sm font-semibold text-gray-500 hover:text-orange-600">Back to FastBite POS</a>
        </form>
    </div>

    <div id="admin-app" class="hidden">
        <nav class="bg-white border-b border-gray-200 px-6 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3"><div class="bg-orange-600 p-2 rounded-lg"><i class="fas fa-hamburger text-white"></i></div><div><p class="font-bold text-gray-800">FastBite<span class="text-orange-600">POS</span></p><p class="text-xs text-gray-500">Admin Management</p></div></div>
            <div class="flex items-center gap-3"><a href="/" class="text-sm font-bold text-gray-500 hover:text-orange-600">Open POS</a><button id="admin-logout" class="px-4 py-2 text-sm font-bold text-red-500 hover:bg-red-50 rounded-lg">Logout</button></div>
        </nav>
        <main class="max-w-7xl mx-auto p-6 space-y-6">
            <div class="flex flex-wrap gap-3 border-b border-gray-200">
                <button class="admin-tab active" data-panel="menu-panel">Menu Management</button>
                <button class="admin-tab" data-panel="orders-panel">Order History</button>
            </div>
            <section id="menu-panel" class="admin-panel space-y-6">
                <div class="flex flex-wrap justify-between gap-4 items-center"><div><h2 class="text-2xl font-bold text-gray-800">Menu Items</h2><p class="text-sm text-gray-500">Changes are immediately available in FastBite POS.</p></div><button id="new-item" class="px-4 py-2.5 bg-orange-600 hover:bg-orange-700 text-white rounded-xl font-bold text-sm"><i class="fas fa-plus mr-2"></i>Add Item</button></div>
                <div id="menu-status" class="hidden"></div>
                <div id="admin-menu-list" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4"></div>
            </section>
            <section id="orders-panel" class="admin-panel hidden space-y-5">
                <div class="flex flex-wrap justify-between gap-4 items-center"><div><h2 class="text-2xl font-bold text-gray-800">Order History</h2><p class="text-sm text-gray-500">Orders from FastBite POS.</p></div><input id="order-search" class="px-4 py-2.5 bg-white border border-gray-200 rounded-xl text-sm outline-none focus:border-orange-500" placeholder="Search bill, name, mobile"></div>
                <div id="admin-orders-list" class="space-y-4"></div>
            </section>
        </main>
    </div>

    <div id="item-modal" class="hidden fixed inset-0 z-50 bg-black/50 p-4 items-center justify-center">
        <form id="item-form" class="bg-white rounded-3xl shadow-xl w-full max-w-lg p-6 space-y-4">
            <div class="flex justify-between items-center"><h2 id="item-modal-title" class="text-xl font-bold text-gray-800">Add Menu Item</h2><button id="close-item-modal" type="button" class="text-gray-400 hover:text-gray-700"><i class="fas fa-times text-xl"></i></button></div>
            <input id="item-id" type="hidden">
            <div><label class="field-label" for="item-name">Item name</label><input id="item-name" required class="field-input"></div>
            <div><label class="field-label" for="item-price">Price</label><input id="item-price" type="number" min="0" step="0.01" required class="field-input"></div>
            <div><label class="field-label" for="item-category">Category</label><input id="item-category" required class="field-input"></div>
            <div><label class="field-label" for="item-image">Image URL</label><input id="item-image" type="url" required class="field-input"></div>
            <p id="item-form-error" class="hidden text-sm text-red-500"></p>
            <button type="submit" class="w-full py-3 bg-orange-600 hover:bg-orange-700 text-white rounded-xl font-bold">Save Item</button>
        </form>
    </div>
    <script src="admin.js"></script>
</body>
</html>
