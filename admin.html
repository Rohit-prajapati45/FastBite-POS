<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FastBite Admin Management</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    body{font-family:Inter,Arial,sans-serif}.hidden{display:none}.row-edit{display:grid;grid-template-columns:1.4fr .6fr .9fr 1.8fr auto auto;gap:10px;align-items:center}
    @media(max-width:900px){.row-edit{grid-template-columns:1fr 1fr}.row-edit .wide{grid-column:1/-1}}
  </style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800">
  <div id="login" class="min-h-screen flex items-center justify-center p-6">
    <form id="login-form" class="bg-white w-full max-w-md rounded-2xl shadow-sm border border-gray-200 p-8">
      <div class="text-center mb-7"><div class="w-14 h-14 mx-auto rounded-xl bg-orange-100 text-orange-600 flex items-center justify-center mb-3"><i class="fas fa-lock text-xl"></i></div><h1 class="text-2xl font-bold">FastBite Admin</h1><p class="text-sm text-gray-500 mt-1">Administrator access only</p></div>
      <input id="username" class="w-full border rounded-xl px-4 py-3 mb-3" placeholder="Admin username" autocomplete="username" required>
      <input id="password" type="password" class="w-full border rounded-xl px-4 py-3 mb-3" placeholder="Admin password" autocomplete="current-password" required>
      <p id="login-error" class="text-sm text-red-600 mb-3 hidden"></p>
      <button class="w-full bg-orange-600 hover:bg-orange-700 text-white rounded-xl py-3 font-bold">LOGIN</button>
    </form>
  </div>

  <div id="app" class="hidden max-w-7xl mx-auto p-6">
    <header class="flex items-center justify-between gap-4 mb-6"><div><h1 class="text-2xl font-bold">Admin Management</h1><p class="text-sm text-gray-500">Manage menu items and view orders.</p></div><div class="flex gap-2"><a href="/" class="px-4 py-2 bg-white border rounded-xl font-semibold">Open POS</a><button id="logout" class="px-4 py-2 bg-red-50 text-red-600 rounded-xl font-semibold">Logout</button></div></header>
    <section class="bg-white rounded-2xl border p-5 mb-6"><div class="flex items-center justify-between mb-4"><h2 class="text-xl font-bold">Menu Management</h2><button id="add" class="bg-orange-600 text-white px-4 py-2 rounded-xl font-bold"><i class="fas fa-plus mr-2"></i>Add Item</button></div><div id="form" class="hidden border rounded-xl p-4 mb-4 bg-gray-50"><div class="grid grid-cols-1 md:grid-cols-2 gap-3"><input id="name" class="border rounded-lg px-3 py-2" placeholder="Item name"><input id="price" type="number" min="0" step="0.01" class="border rounded-lg px-3 py-2" placeholder="Price"><input id="category" class="border rounded-lg px-3 py-2" placeholder="Category"><input id="img" class="border rounded-lg px-3 py-2" placeholder="Image URL"></div><div class="mt-3 flex gap-2"><button id="save" class="bg-orange-600 text-white px-4 py-2 rounded-lg font-bold">Save</button><button id="cancel" class="bg-white border px-4 py-2 rounded-lg font-semibold">Cancel</button></div><p id="form-error" class="text-sm text-red-600 mt-2 hidden"></p></div><div id="menu" class="space-y-2"></div></section>
    <section class="bg-white rounded-2xl border p-5"><div class="flex items-center justify-between mb-4"><h2 class="text-xl font-bold">Order History</h2><button id="refresh" class="bg-gray-100 px-4 py-2 rounded-xl font-semibold"><i class="fas fa-refresh mr-2"></i>Refresh</button></div><div id="orders" class="space-y-3"></div></section>
  </div>
<script>
let editingId=null,items=[];
const $=id=>document.getElementById(id);
async function api(url,options={}){const r=await fetch(url,{credentials:'include',...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.message||'Request failed');return d}
async function boot(){try{const me=await api('/api/me');if(me.user.role!=='admin')throw new Error('Admin access required.');$('login').classList.add('hidden');$('app').classList.remove('hidden');await Promise.all([loadMenu(),loadOrders()]);}catch(e){$('login-error').textContent=e.message;$('login-error').classList.remove('hidden')}}
$('login-form').onsubmit=async e=>{e.preventDefault();$('login-error').classList.add('hidden');try{const d=await api('/api/login',{method:'POST',body:JSON.stringify({username:$('username').value.trim(),password:$('password').value})});if(d.user.role!=='admin'){await api('/api/logout',{method:'POST'});throw new Error('Admin access required.');}$('login').classList.add('hidden');$('app').classList.remove('hidden');await Promise.all([loadMenu(),loadOrders()]);}catch(e){$('login-error').textContent=e.message;$('login-error').classList.remove('hidden')}};
async function loadMenu(){const d=await api('/api/menu');items=d.items||[];renderMenu()}
function renderMenu(){ $('menu').innerHTML=items.map(i=>`<div class="border rounded-xl p-3"><div class="row-edit"><input class="border rounded-lg px-2 py-2" value="${esc(i.name)}" data-field="name"><input class="border rounded-lg px-2 py-2" type="number" min="0" step="0.01" value="${Number(i.price)}" data-field="price"><input class="border rounded-lg px-2 py-2" value="${esc(i.category)}" data-field="category"><input class="wide border rounded-lg px-2 py-2" value="${esc(i.img)}" data-field="img"><button class="save-row bg-orange-600 text-white px-3 py-2 rounded-lg" data-id="${i.id}">Save</button><button class="delete-row bg-red-50 text-red-600 px-3 py-2 rounded-lg" data-id="${i.id}">Delete</button></div></div>`).join('')||'<p class="text-gray-500">No menu items.</p>'}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('menu').onclick=async e=>{const b=e.target.closest('button');if(!b)return;const id=Number(b.dataset.id);const row=b.parentElement;try{if(b.classList.contains('delete-row')){if(!confirm('Delete this item?'))return;await api('/api/menu/'+id,{method:'DELETE'});}else{const data={};row.querySelectorAll('[data-field]').forEach(x=>data[x.dataset.field]=x.value);data.price=Number(data.price);await api('/api/menu/'+id,{method:'PUT',body:JSON.stringify(data)});}await loadMenu();}catch(err){alert(err.message)}};
$('add').onclick=()=>{$('form').classList.remove('hidden');editingId=null;['name','price','category','img'].forEach(id=>$(id).value='');$('name').focus()};$('cancel').onclick=()=>{$('form').classList.add('hidden')};$('save').onclick=async()=>{const data={name:$('name').value.trim(),price:Number($('price').value),category:$('category').value.trim(),img:$('img').value.trim()};try{if(!data.name||!data.category||!data.img||!Number.isFinite(data.price)||data.price<0)throw new Error('Fill all fields correctly.');await api('/api/menu',{method:'POST',body:JSON.stringify(data)});$('form').classList.add('hidden');await loadMenu()}catch(e){$('form-error').textContent=e.message;$('form-error').classList.remove('hidden')}};
async function loadOrders(){try{const d=await api('/api/orders');const os=d.orders||[];$('orders').innerHTML=os.map(o=>`<details class="border rounded-xl p-4"><summary class="cursor-pointer flex justify-between gap-3"><span><b>#${esc(o.billNo)}</b> · ${esc(o.customerName||'Guest')} · ${esc(o.paymentMethod||'')}</span><b class="text-orange-600">₹${Number(o.total||0).toFixed(2)}</b></summary><div class="mt-4 pt-4 border-t"><p class="text-xs text-gray-500 mb-2">${esc(o.timestamp||'')}</p>${(o.items||[]).map(i=>`<div class="flex justify-between py-1"><span>${esc(i.name)} × ${Number(i.qty||0)}</span><span>₹${(Number(i.price||0)*Number(i.qty||0)).toFixed(2)}</span></div>`).join('')}<div class="border-t mt-2 pt-2 text-sm">Subtotal: ₹${Number(o.subtotal||0).toFixed(2)} · GST: ₹${Number(o.tax||0).toFixed(2)} · <b>Total: ₹${Number(o.total||0).toFixed(2)}</b></div></div></details>`).join('')||'<p class="text-gray-500">No orders yet.</p>'}catch(e){$('orders').innerHTML='<p class="text-red-600">'+esc(e.message)+'</p>'}}
$('refresh').onclick=()=>Promise.all([loadMenu(),loadOrders()]);$('logout').onclick=async()=>{await api('/api/logout',{method:'POST'});location.reload()};boot();
</script>
</body>
</html>
